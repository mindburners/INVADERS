<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MINDBURNER INVADERS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #060706;
    color: #39ff14;
    font-family: 'Courier New', monospace;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }
  #hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 10px;
    padding: 6px 10px;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  @media (max-width: 520px) {
    #hud { font-size: 11px; letter-spacing: 1px; }
  }
  #gameCanvas {
    background: #0a0d0a;
    border: 2px solid #1f4a15;
    box-shadow: 0 0 30px rgba(57,255,20,0.15), inset 0 0 60px rgba(0,0,0,0.6);
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(4,6,4,0.85);
    text-align: center;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 32px;
    color: #39ff14;
    text-shadow: 0 0 12px #39ff14;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  #overlay p {
    color: #9adf8f;
    font-size: 14px;
    margin: 4px 0 18px 0;
    letter-spacing: 1px;
  }
  #overlay button {
    background: #0a0d0a;
    border: 2px solid #39ff14;
    color: #39ff14;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 10px 22px;
    cursor: pointer;
    text-transform: uppercase;
  }
  #overlay button:hover { background: #14210f; }
  #touchControls {
    display: none;
    width: 100%;
    max-width: 800px;
    justify-content: space-between;
    margin-top: 10px;
    gap: 8px;
  }
  #touchControls button {
    flex: 1;
    background: #0a0d0a;
    border: 2px solid #1f4a15;
    color: #39ff14;
    font-family: inherit;
    font-size: 18px;
    padding: 16px 0;
    letter-spacing: 2px;
  }
  #stage {
    position: relative;
  }
  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.12) 3px,
      rgba(0,0,0,0) 4px
    );
  }
  @media (hover: none) and (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="scoreLine">SCORE: 0</span>
    <span id="highScoreLine">HIGH: 0</span>
    <span id="waveLine">WAVE: 1</span>
    <span id="livesLine">LIVES: 3</span>
    <span id="soundToggle" style="cursor:pointer;">SOUND: ON</span>
  </div>
  <div id="stage">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="scanlines"></div>
    <div id="overlay">
      <h1 id="overlayTitle">MINDBURNER INVADERS</h1>
      <p id="overlaySub">ARROW KEYS / A-D TO MOVE &nbsp;·&nbsp; SPACE TO FIRE &nbsp;·&nbsp; SHOOT THE MIDI PLUG SAUCER FOR BONUS POINTS</p>
      <p id="overlayHighScore" style="color:#39ff14;font-size:13px;letter-spacing:2px;margin:-8px 0 18px 0;">HIGH SCORE: 0</p>
      <button id="overlayBtn">START</button>
    </div>
  </div>
  <div id="touchControls">
    <button id="btnLeft">◀</button>
    <button id="btnFire">FIRE</button>
    <button id="btnRight">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreLine = document.getElementById('scoreLine');
const waveLine = document.getElementById('waveLine');
const livesLine = document.getElementById('livesLine');
const highScoreLine = document.getElementById('highScoreLine');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const overlayBtn = document.getElementById('overlayBtn');
const soundToggle = document.getElementById('soundToggle');

// ---------- Sound engine (classic Space-Invaders style, generated live) ----------
let audioCtx = null;
let soundOn = true;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, duration, type, startGain, endGain, delay) {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(startGain != null ? startGain : 0.15, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, endGain != null ? endGain : 0.0001), t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
  return osc;
}

function noiseBurst(duration, startGain, filterFreq) {
  if (!soundOn || !audioCtx) return;
  const bufferSize = Math.floor(audioCtx.sampleRate * duration);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq || 1200;
  const gain = audioCtx.createGain();
  const t0 = audioCtx.currentTime;
  gain.gain.setValueAtTime(startGain != null ? startGain : 0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start(t0);
  src.stop(t0 + duration);
}

function playShoot() {
  beep(900, 0.14, 'square', 0.08, 0.0001, 0);
  if (soundOn && audioCtx) {
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(900, t0);
    osc.frequency.exponentialRampToValueAtTime(220, t0 + 0.13);
    gain.gain.setValueAtTime(0.09, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.16);
  }
}

function playInvaderExplosion() {
  noiseBurst(0.18, 0.22, 900);
}

function playPlayerExplosion() {
  noiseBurst(0.5, 0.28, 350);
  beep(90, 0.5, 'sawtooth', 0.15, 0.0001, 0);
}

// Big dramatic "crash" when the player is destroyed (lives hits 0)
function playCrash() {
  if (!soundOn || !audioCtx) return;
  // layered noise crash
  noiseBurst(0.9, 0.35, 220);
  noiseBurst(0.5, 0.3, 1800);
  // descending sirens
  const t0 = audioCtx.currentTime;
  [0, 0.06, 0.12].forEach((delay, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = i === 0 ? 'sawtooth' : 'square';
    osc.frequency.setValueAtTime(600 - i * 80, t0 + delay);
    osc.frequency.exponentialRampToValueAtTime(40, t0 + delay + 0.8);
    gain.gain.setValueAtTime(0.16, t0 + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + 0.85);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0 + delay);
    osc.stop(t0 + delay + 0.9);
  });
}

function playSaucerHit() {
  // classic ascending bonus arpeggio
  [660, 880, 1100, 1320].forEach((f, i) => beep(f, 0.12, 'square', 0.1, 0.0001, i * 0.07));
}

let saucerOsc = null, saucerGain = null;
function startSaucerHum() {
  if (!soundOn || !audioCtx) return;
  stopSaucerHum();
  saucerOsc = audioCtx.createOscillator();
  saucerGain = audioCtx.createGain();
  saucerOsc.type = 'sawtooth';
  saucerGain.gain.value = 0.05;
  saucerOsc.connect(saucerGain);
  saucerGain.connect(audioCtx.destination);
  saucerOsc.start();
}
function updateSaucerHum(t) {
  if (saucerOsc) {
    const wobble = 500 + Math.sin(t * 0.3) * 120;
    saucerOsc.frequency.setValueAtTime(wobble, audioCtx.currentTime);
  }
}
function stopSaucerHum() {
  if (saucerOsc) {
    try { saucerOsc.stop(); } catch (e) {}
    saucerOsc.disconnect();
    saucerOsc = null;
  }
}

// classic 4-note descending "walk" bass loop, tied to remaining invader count
const walkNotes = [110, 98, 87, 82];
let walkStep = 0;
let walkTimer = 0;
function updateWalkBeat(aliveCount, totalCount) {
  if (!soundOn || !audioCtx || aliveCount === 0) return;
  walkTimer--;
  const frac = aliveCount / Math.max(1, totalCount);
  const interval = Math.max(6, Math.floor(6 + frac * 34)); // speeds up as invaders die
  if (walkTimer <= 0) {
    beep(walkNotes[walkStep % walkNotes.length], 0.11, 'square', 0.12, 0.0001, 0);
    walkStep++;
    walkTimer = interval;
  }
}

soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  soundToggle.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
  if (!soundOn) stopSaucerHum();
});

// ---------- Game state ----------
let score = 0;
let lives = 3;
let wave = 1;
let running = false;
let gameOver = false;

// ---------- High score (persisted via localStorage where available) ----------
const HIGH_SCORE_KEY = 'mindburner_invaders_highscore';
let highScore = 0;
let justBeatHighScore = false;

function loadHighScore() {
  try {
    const v = localStorage.getItem(HIGH_SCORE_KEY);
    highScore = v ? parseInt(v, 10) || 0 : 0;
  } catch (e) {
    highScore = 0; // localStorage unavailable (e.g. sandboxed preview) — falls back to session only
  }
}

function saveHighScore() {
  try {
    localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
  } catch (e) {
    // ignore — score just won't persist across reloads in this environment
  }
}

function checkHighScore() {
  if (score > highScore) {
    highScore = score;
    justBeatHighScore = true;
    saveHighScore();
  }
}

loadHighScore();

const player = {
  w: 46, h: 22,
  x: W / 2 - 23,
  y: H - 50,
  speed: 6,
  cooldown: 0
};

let bullets = [];      // player bullets
let enemyBullets = [];
let invaders = [];
let invaderDir = 1;
let invaderBaseSpeed = 0.85;   // set per wave
let invaderSpeed = 0.85;       // effective speed, recalculated live as TVs are destroyed
let invaderDropAmount = 22;
let invaderShootTimer = 0;
let invaderAnimPhase = 0;
let invaderAnimAccum = 0;

// MIDI-plug saucer (bonus enemy)
const saucer = {
  x: -60, y: 34, w: 46, h: 46,
  dir: 1, active: false, speed: 3.2
};
let saucerTimer = 0;

// ---------- Destructible bases (bunkers) ----------
const BASE_BLOCK = 6;
const BASE_MASK = [
  '111111111',
  '111111111',
  '111111111',
  '111111111',
  '111001111',
  '110000011'
];
const BASE_ROWS = BASE_MASK.length;
const BASE_COLS = BASE_MASK[0].length;
let bases = [];

function buildBases() {
  bases = [];
  const numBases = 4;
  const baseW = BASE_COLS * BASE_BLOCK;
  const totalSpan = W - 120;
  const gap = (totalSpan - numBases * baseW) / (numBases - 1);
  const startX = 60;
  const baseY = player.y - 110;
  for (let i = 0; i < numBases; i++) {
    const bx = startX + i * (baseW + gap);
    const grid = BASE_MASK.map(row => row.split('').map(ch => ch === '1'));
    bases.push({ x: bx, y: baseY, grid });
  }
}

function drawBases() {
  bases.forEach(base => {
    for (let r = 0; r < BASE_ROWS; r++) {
      for (let c = 0; c < BASE_COLS; c++) {
        if (base.grid[r][c]) {
          const bx = base.x + c * BASE_BLOCK;
          const by = base.y + r * BASE_BLOCK;
          ctx.fillStyle = hexToRgba(currentTheme.accent, 0.55);
          ctx.fillRect(bx, by, BASE_BLOCK - 1, BASE_BLOCK - 1);
        }
      }
    }
  });
}

// Damages a base at a bullet's position; returns true if it hit something (and consumes the bullet).
function hitBase(bx, by) {
  for (const base of bases) {
    const localX = bx - base.x;
    const localY = by - base.y;
    if (localX < 0 || localY < 0) continue;
    const c = Math.floor(localX / BASE_BLOCK);
    const r = Math.floor(localY / BASE_BLOCK);
    if (r < 0 || r >= BASE_ROWS || c < 0 || c >= BASE_COLS) continue;
    if (base.grid[r][c]) {
      // chip out a small chunk around the impact point
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < BASE_ROWS && cc >= 0 && cc < BASE_COLS) {
            if (Math.random() < 0.7 || (dr === 0 && dc === 0)) base.grid[rr][cc] = false;
          }
        }
      }
      return true;
    }
  }
  return false;
}

const keys = {};

// ---------- Wave colour themes (palette shift every 5 waves, starting at wave 5) ----------
const THEMES = [
  { // waves 1-4: classic Mindburner red TVs / green terminal
    name: 'SIGNAL: RED',
    tvBody: '#c0392b', tvDark: '#7a1f16', accent: '#39ff14',
    bg: '#0a0d0a', star: 'rgba(57,255,20,0.15)',
    bulletPlayer: '#39ff14', bulletEnemy: '#ff5533'
  },
  { // waves 5-9: violet TVs / cyan terminal
    name: 'SIGNAL: VIOLET',
    tvBody: '#8e44ad', tvDark: '#4a235a', accent: '#00e5ff',
    bg: '#0a080d', star: 'rgba(0,229,255,0.15)',
    bulletPlayer: '#00e5ff', bulletEnemy: '#ff3d7f'
  },
  { // waves 10-14: amber TVs / magenta terminal
    name: 'SIGNAL: AMBER',
    tvBody: '#d68910', tvDark: '#7e4c07', accent: '#ff2fd6',
    bg: '#0d0a08', star: 'rgba(255,47,214,0.15)',
    bulletPlayer: '#ff2fd6', bulletEnemy: '#ffd23f'
  },
  { // waves 15-19: teal TVs / white terminal
    name: 'SIGNAL: TEAL',
    tvBody: '#16a085', tvDark: '#0b5346', accent: '#f0f0f0',
    bg: '#080d0c', star: 'rgba(240,240,240,0.12)',
    bulletPlayer: '#f0f0f0', bulletEnemy: '#16a085'
  }
];
let currentTheme = THEMES[0];
let themeFlashTimer = 0;

function updateTheme(waveNum) {
  const idx = Math.floor((waveNum - 1) / 4) % THEMES.length;
  const next = THEMES[idx];
  if (next !== currentTheme) {
    currentTheme = next;
    themeFlashTimer = 90;
  }
}

function buildWave(waveNum) {
  invaders = [];
  updateTheme(waveNum);
  const cols = 8;
  const rows = 5;
  const spacingX = 68;
  const spacingY = 52;
  const startX = (W - (cols - 1) * spacingX) / 2;
  const startY = 70;
  for (let r = 0; r < rows; r++) {
    // 3 TV types by row, classic-Invaders style: rare top row, common bottom rows
    const type = r === 0 ? 2 : (r <= 2 ? 1 : 0);
    for (let c = 0; c < cols; c++) {
      invaders.push({
        x: startX + c * spacingX,
        y: startY + r * spacingY,
        w: 40, h: 30,
        alive: true,
        row: r,
        type: type,
        flicker: Math.random() * 10
      });
    }
  }
  invaderSpeed = 0.85 + (waveNum - 1) * 0.35;
  invaderBaseSpeed = invaderSpeed;
  invaderDir = 1;
  invaderAnimPhase = 0;
  invaderAnimAccum = 0;
  buildBases();
}

function scoreForRow(row) {
  if (row === 0) return 30; // rare "satellite" TV
  if (row <= 2) return 20;  // standard "portable" TV
  return 10;                // common "console" TV
}

function resetGame() {
  score = 0;
  lives = 3;
  wave = 1;
  bullets = [];
  enemyBullets = [];
  saucer.active = false;
  saucerTimer = 500;
  stopSaucerHum();
  currentTheme = THEMES[0];
  themeFlashTimer = 0;
  justBeatHighScore = false;
  player.x = W / 2 - player.w / 2;
  buildWave(wave);
  updateHUD();
}

function updateHUD() {
  checkHighScore();
  scoreLine.textContent = 'SCORE: ' + score;
  highScoreLine.textContent = 'HIGH: ' + highScore;
  waveLine.textContent = 'WAVE: ' + wave;
  livesLine.textContent = 'LIVES: ' + lives;
}

// ---------- Drawing: 3 Mindburner TV invader types (classic-Invaders style hierarchy) ----------
// type 0 = "CONSOLE" (bottom rows, common, 10pts) — bulky box set, twin rod antennae
// type 1 = "PORTABLE" (middle rows, standard, 20pts) — the original V-antenna design
// type 2 = "SATELLITE" (top row, rare, 30pts) — sleek loop-antenna set with a halo ring
function drawTV(x, y, w, h, alive, flickerSeed, t, type, phase) {
  if (!alive) return;
  const bodyColor = currentTheme.tvBody;
  const bodyDark = currentTheme.tvDark;
  const screenColor = '#0a0d0a';
  const antennaColor = '#e0e0e0';
  const ty = type || 0;

  ctx.save();
  ctx.translate(x, y);

  // walk-cycle animation: alternating tilt + bob around the base, like classic invader legs
  const bob = phase ? -2 : 0;
  const tilt = phase ? 0.06 : -0.06;
  ctx.translate(0, bob);
  ctx.translate(w / 2, h);
  ctx.rotate(tilt);
  ctx.translate(-w / 2, -h);

  if (ty === 2) {
    // SATELLITE: loop antenna + glowing halo ring, narrower body
    const haloPulse = 0.5 + 0.5 * Math.sin(t * 0.12 + flickerSeed);
    ctx.strokeStyle = hexToRgba(currentTheme.accent, 0.5 * haloPulse);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(w / 2, h / 2 - 2, w * 0.62, h * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = antennaColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.5, 2);
    ctx.lineTo(w * 0.5, -8);
    ctx.arc(w * 0.5, -10, 3, 0, Math.PI * 2);
    ctx.stroke();
  } else if (ty === 0) {
    // CONSOLE: two straight parallel rod antennae, bulkier stance
    ctx.strokeStyle = antennaColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.28, 2);
    ctx.lineTo(w * 0.28, -11);
    ctx.moveTo(w * 0.72, 2);
    ctx.lineTo(w * 0.72, -11);
    ctx.stroke();
  } else {
    // PORTABLE: classic V-shaped rabbit-ear antennae
    ctx.strokeStyle = antennaColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.35, 2);
    ctx.lineTo(w * 0.15, -10);
    ctx.moveTo(w * 0.65, 2);
    ctx.lineTo(w * 0.85, -10);
    ctx.stroke();
  }

  // TV body
  ctx.fillStyle = bodyColor;
  ctx.fillRect(0, 2, w, h - 2);
  ctx.fillStyle = bodyDark;
  ctx.fillRect(0, h - 6, w, 4);

  if (ty === 0) {
    // CONSOLE: extra dark trim band + side grille dots (bulkier / older set look)
    ctx.fillStyle = bodyDark;
    ctx.fillRect(0, 2, w, 3);
    ctx.fillStyle = hexToRgba('#000000', 0.4);
    ctx.fillRect(2, h - 5, 2, 2);
    ctx.fillRect(w - 4, h - 5, 2, 2);
  } else if (ty === 2) {
    // SATELLITE: small side dial to feel more premium/rare
    ctx.fillStyle = currentTheme.accent;
    ctx.beginPath();
    ctx.arc(w - 6, h - 8, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // screen
  const scrPad = ty === 2 ? 6 : 5;
  ctx.fillStyle = screenColor;
  ctx.fillRect(scrPad, scrPad + 3, w - scrPad * 2, h - scrPad * 2 - 4);

  // flicker scanline glow on screen (theme accent colour)
  const flick = 0.5 + 0.5 * Math.sin(t * 0.15 + flickerSeed);
  ctx.fillStyle = hexToRgba(currentTheme.accent, 0.25 + 0.3 * flick);
  const sy = scrPad + 3 + ((Math.floor(t / 4) + Math.floor(flickerSeed)) % (h - scrPad * 2 - 4));
  ctx.fillRect(scrPad, sy, w - scrPad * 2, 2);

  // little feet
  ctx.fillStyle = bodyDark;
  ctx.fillRect(4, h, 4, 3);
  ctx.fillRect(w - 8, h, 4, 3);

  ctx.restore();
}

// ---------- Shared: draw a front-facing 5-pin MIDI DIN plug/socket ----------
// Used for both the bonus saucer and the player's ship.
function drawMidiPlug(cx, cy, r, t, opts) {
  const o = opts || {};
  const shellColor = o.shellColor || '#1c1e1c';
  const ringColor = o.ringColor || '#39ff14';
  const collarColor = o.collarColor || '#2a2c2a';
  const pinColor = o.pinColor || '#39ff14';
  const glow = o.glow !== false;
  const pulse = 0.6 + 0.4 * Math.sin(t * 0.25);

  ctx.save();

  if (glow) {
    const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.4);
    grad.addColorStop(0, hexToRgba(ringColor, 0.25 * pulse));
    grad.addColorStop(1, hexToRgba(ringColor, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // outer metal shell
  ctx.fillStyle = shellColor;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // inner plastic collar
  ctx.fillStyle = collarColor;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
  ctx.fill();

  // keying notch at the bottom (standard DIN-5 orientation cue)
  ctx.fillStyle = '#0a0d0a';
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy + r * 0.82 - 1);
  ctx.lineTo(cx + 4, cy + r * 0.82 - 1);
  ctx.lineTo(cx, cy + r * 0.82 - 7);
  ctx.closePath();
  ctx.fill();

  // exactly 5 pins, evenly spaced 72° apart starting from the top (pentagon layout)
  const pinR = r * 0.46;
  const pinAngles = [-90, -90 + 72, -90 + 144, -90 + 216, -90 + 288]; // 5 distinct angles only
  ctx.fillStyle = hexToRgba(pinColor, 0.7 + 0.3 * pulse);
  pinAngles.forEach(a => {
    const rad = a * Math.PI / 180;
    const px = cx + Math.cos(rad) * pinR;
    const py = cy + Math.sin(rad) * pinR;
    ctx.beginPath();
    ctx.arc(px, py, 2.6, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const bigint = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---------- Drawing: bonus saucer as a front-facing 5-pin MIDI DIN plug ----------
function drawMidiSaucer(x, y, w, h, t) {
  const cx = x + w / 2;
  const cy = y + h / 2;
  const r = w / 2;
  drawMidiPlug(cx, cy, r, t, {});
}

function drawPlayer() {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const r = Math.min(player.w, player.h + 12) / 2;
  drawMidiPlug(cx, cy, r, frameT, {
    shellColor: '#141614',
    ringColor: currentTheme.accent,
    collarColor: '#232523',
    pinColor: currentTheme.accent,
    glow: true
  });
  // small nozzle on top so it still reads as "facing up"
  ctx.save();
  ctx.fillStyle = currentTheme.accent;
  ctx.fillRect(cx - 2, player.y - 6, 4, 8);
  ctx.restore();
}

function drawBullets() {
  ctx.fillStyle = currentTheme.bulletPlayer;
  bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 12));
  ctx.fillStyle = currentTheme.bulletEnemy;
  enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 12));
}

let frameT = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // subtle starfield
  ctx.fillStyle = currentTheme.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = currentTheme.star;
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137 + Math.floor(frameT * 0.2)) % W;
    const sy = (i * 71) % H;
    ctx.fillRect(sx, sy, 1, 1);
  }

  invaders.forEach(inv => drawTV(inv.x, inv.y, inv.w, inv.h, inv.alive, inv.flicker, frameT, inv.type, invaderAnimPhase));
  if (saucer.active) drawMidiSaucer(saucer.x, saucer.y, saucer.w, saucer.h, frameT);
  drawBases();
  drawPlayer();
  drawBullets();

  // brief "SIGNAL SHIFT" banner when the palette changes
  if (themeFlashTimer > 0) {
    themeFlashTimer--;
    const alpha = Math.min(1, themeFlashTimer / 30);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = currentTheme.accent;
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = currentTheme.accent;
    ctx.shadowBlur = 12;
    ctx.fillText(currentTheme.name, W / 2, 40);
    ctx.restore();
  }
}

// ---------- Update / physics ----------
function update() {
  frameT++;

  // player movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  if (player.cooldown > 0) player.cooldown--;
  if ((keys[' '] || keys['Spacebar']) && player.cooldown === 0) {
    bullets.push({ x: player.x + player.w / 2 - 1.5, y: player.y - 4 });
    player.cooldown = 14;
    playShoot();
  }

  // move bullets
  bullets.forEach(b => b.y -= 9);
  bullets = bullets.filter(b => b.y > -20 && !hitBase(b.x + 1.5, b.y));

  enemyBullets.forEach(b => b.y += 6.5);
  enemyBullets = enemyBullets.filter(b => b.y < H + 20 && !hitBase(b.x + 1.5, b.y));

  // move invader swarm — speeds up dramatically as fewer TVs remain, just like the original
  let hitEdge = false;
  const aliveInvaders = invaders.filter(i => i.alive);
  const aliveFrac = invaders.length > 0 ? aliveInvaders.length / invaders.length : 1;
  invaderSpeed = invaderBaseSpeed * (1 + (1 - aliveFrac) * 4.5);

  aliveInvaders.forEach(inv => {
    inv.x += invaderSpeed * invaderDir;
    if (inv.x < 10 || inv.x + inv.w > W - 10) hitEdge = true;
  });
  if (hitEdge) {
    invaderDir *= -1;
    aliveInvaders.forEach(inv => { inv.y += invaderDropAmount; });
  }

  // walk-cycle animation toggle, tied to the same speed so it visibly quickens too
  invaderAnimAccum += invaderSpeed;
  if (invaderAnimAccum > 26) {
    invaderAnimPhase = 1 - invaderAnimPhase;
    invaderAnimAccum = 0;
  }

  // invader shooting — more frequent and can double up at higher waves
  invaderShootTimer--;
  if (invaderShootTimer <= 0 && aliveInvaders.length > 0) {
    const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
    enemyBullets.push({ x: shooter.x + shooter.w / 2 - 1.5, y: shooter.y + shooter.h });
    if (wave >= 4 && Math.random() < 0.3 && aliveInvaders.length > 1) {
      const shooter2 = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
      enemyBullets.push({ x: shooter2.x + shooter2.w / 2 - 1.5, y: shooter2.y + shooter2.h });
    }
    invaderShootTimer = Math.max(10, 48 - wave * 5);
  }

  // classic descending "walk" bass beat, speeding up as fewer TVs remain
  updateWalkBeat(aliveInvaders.length, invaders.length);

  // ---- bonus MIDI-plug saucer ----
  if (!saucer.active) {
    saucerTimer--;
    if (saucerTimer <= 0) {
      saucer.active = true;
      saucer.dir = Math.random() < 0.5 ? 1 : -1;
      saucer.x = saucer.dir === 1 ? -saucer.w : W + saucer.w;
      saucer.y = 34;
      startSaucerHum();
      saucerTimer = 600 + Math.floor(Math.random() * 400);
    }
  } else {
    saucer.x += saucer.speed * saucer.dir;
    updateSaucerHum(frameT);
    if (saucer.x < -saucer.w - 10 || saucer.x > W + 10) {
      saucer.active = false;
      stopSaucerHum();
    }
  }

  // collisions: player bullets vs invaders
  bullets.forEach(b => {
    invaders.forEach(inv => {
      if (!inv.alive) return;
      if (b.x < inv.x + inv.w && b.x + 3 > inv.x && b.y < inv.y + inv.h && b.y + 12 > inv.y) {
        inv.alive = false;
        b.y = -999;
        score += scoreForRow(inv.row);
        updateHUD();
        playInvaderExplosion();
      }
    });
  });

  // collisions: player bullets vs bonus saucer
  if (saucer.active) {
    bullets.forEach(b => {
      if (b.y < -900) return;
      if (b.x < saucer.x + saucer.w && b.x + 3 > saucer.x &&
          b.y < saucer.y + saucer.h && b.y + 12 > saucer.y) {
        const bonus = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
        score += bonus;
        updateHUD();
        saucer.active = false;
        stopSaucerHum();
        playSaucerHit();
        b.y = -999;
      }
    });
  }

  bullets = bullets.filter(b => b.y > -100);

  // collisions: enemy bullets vs player
  enemyBullets.forEach(b => {
    if (b.x < player.x + player.w && b.x + 3 > player.x &&
        b.y < player.y + player.h && b.y + 12 > player.y) {
      b.y = H + 999;
      loseLife();
    }
  });

  // invaders reach player line -> lose life & reset wave position
  const stillAlive = invaders.filter(i => i.alive);
  const reachedBottom = stillAlive.some(inv => inv.y + inv.h > player.y - 4);
  if (reachedBottom) {
    loseLife();
    buildWave(wave);
  }

  // wave cleared
  if (stillAlive.length === 0) {
    wave++;
    updateHUD();
    buildWave(wave);
  }
}

function loseLife() {
  lives--;
  updateHUD();
  enemyBullets = [];
  bullets = [];
  player.x = W / 2 - player.w / 2;
  if (lives <= 0) {
    playCrash();
    endGame(false);
  } else {
    playPlayerExplosion();
  }
}

function endGame(won) {
  running = false;
  gameOver = true;
  stopSaucerHum();
  saucer.active = false;
  document.getElementById('overlayHighScore').style.display = 'none';
  overlayTitle.textContent = justBeatHighScore ? 'NEW HIGH SCORE!' : (won ? 'WAVE CLEARED' : 'SIGNAL LOST');
  overlaySub.textContent = 'FINAL SCORE: ' + score + '   ·   HIGH: ' + highScore + '   ·   REACHED WAVE ' + wave;
  overlayBtn.textContent = 'RETRY';
  overlay.style.display = 'flex';
}

// ---------- Main loop ----------
function loop() {
  if (running) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

// ---------- Input ----------
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

overlayBtn.addEventListener('click', () => {
  ensureAudio();
  resetGame();
  overlay.style.display = 'none';
  running = true;
  gameOver = false;
});

// touch controls
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnFire = document.getElementById('btnFire');

function bindHold(btn, key) {
  const start = e => { e.preventDefault(); keys[key] = true; };
  const end = e => { e.preventDefault(); keys[key] = false; };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
bindHold(btnLeft, 'ArrowLeft');
bindHold(btnRight, 'ArrowRight');
bindHold(btnFire, ' ');

// initial state
resetGame();
document.getElementById('overlayHighScore').textContent = 'HIGH SCORE: ' + highScore;
draw();
overlay.style.display = 'flex';
loop();
</script>
</body>
</html>
